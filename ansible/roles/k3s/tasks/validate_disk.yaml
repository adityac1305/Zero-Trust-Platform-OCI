---

- name: Verify /data is mounted
  ansible.builtin.command: mountpoint -q /data
  register: mount_check
  failed_when: mount_check.rc != 0

- name: Show disk usage
  ansible.builtin.command: df -h /data
  register: df_output
  changed_when: false

- name: Debug disk usage
  ansible.builtin.debug:
    var: df_output.stdout_lines
