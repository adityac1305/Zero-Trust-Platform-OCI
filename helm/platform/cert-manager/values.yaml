---
# helm/platform/cert-manager/values.yaml
#
# cert-manager v1.20.x — tuned for a k3s single-node ARM64 OCI instance.
#
# To upgrade cert-manager: change version in
# helmrelease.yaml → merge to main.

# ── CRD management ───────────────────────────────────────────────────────────
# enabled=true → Helm owns the CRDs and handles schema migrations on upgrade.
# keep=true    → CRDs survive `helm uninstall`.
#                Only set keep=false if you want a complete wipe including certs.
crds:
  enabled: true
  keep: true

# ── Replica count ────────────────────────────────────────────────────────────
# 1 is correct for a single-node k3s cluster.
# Increase to 2 if you add nodes.
replicaCount: 1

# ── Feature gates ────────────────────────────────────────────────────────────
# cert-manager 1.15+ has Gateway API support promoted to beta.
#
# ExperimentalGatewayAPISupport is enabled by default in cert-manager 1.20,
# but we explicitly keep it enabled here for clarity and future-proofing.
featureGates: "ExperimentalGatewayAPISupport=true"

# ── Gateway API integration ──────────────────────────────────────────────────
# IMPORTANT:
# This is separate from the ExperimentalGatewayAPISupport feature gate.
#
# Gateway API CRDs are already installed in the cluster:
#   gateways.gateway.networking.k8s.io
#   httproutes.gateway.networking.k8s.io
#
# Enabling this causes cert-manager to initialize its Gateway API integration
# and allows the ACME HTTP-01 solver to create temporary HTTPRoutes.

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true


# ── Controller (main cert-manager pod) ───────────────────────────────────────
nodeSelector:
  kubernetes.io/os: linux

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# ── Webhook ──────────────────────────────────────────────────────────────────
# Validates and mutates Certificate, CertificateRequest,
# and Issuer resources.
webhook:
  replicaCount: 1
  timeoutSeconds: 10

  nodeSelector:
    kubernetes.io/os: linux

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── CA Injector ──────────────────────────────────────────────────────────────
# Injects CA bundles into webhook configurations and CRD conversion webhooks.
# Must remain enabled.
cainjector:
  enabled: true
  replicaCount: 1

  nodeSelector:
    kubernetes.io/os: linux

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── Startup API check ────────────────────────────────────────────────────────
# One-shot Job that probes the cert-manager API after install/upgrade.
#
# Keep enabled — this allows Helm --wait/--atomic to verify cert-manager
# is actually ready.
startupapicheck:
  enabled: true

  nodeSelector:
    kubernetes.io/os: linux

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── Prometheus metrics ───────────────────────────────────────────────────────
# Disabled — no Prometheus stack installed.
prometheus:
  enabled: false

# ── Log level ────────────────────────────────────────────────────────────────
# 2 = standard info logging.
# Set to 4-6 when debugging ACME challenge failures.
# logLevel: 2

# ── Global settings ──────────────────────────────────────────────────────────
global:
  # leaderElection namespace must match the install namespace.
  #
  # Required even with replicaCount=1 because the controller uses
  # Kubernetes leader election.
  leaderElection:
    namespace: cert-manager
