---
name: Security CI

on:
  pull_request:
  workflow_dispatch:

jobs:

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python3 -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint \
            -d '{extends: default, rules: {truthy: disable}}' \
            .

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    needs: yaml-lint

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2