---
name: Security CI

on:
  pull_request:
  workflow_dispatch:

jobs:

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python3 -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint \
            -d '{extends: default, rules: {truthy: disable, line-length: {max:300}}}' \
            .

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    needs: yaml-lint

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
