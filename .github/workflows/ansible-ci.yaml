---
name: Ansible CI

on:
  pull_request:
    paths:
      - "ansible/**"

  workflow_dispatch:

jobs:

  syntax:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure Ansible
        run: |
          echo "ANSIBLE_CONFIG=ansible/ansible.cfg" >> $GITHUB_ENV

      - name: Syntax Check OS Bootstrap
        run: |
          ansible-playbook \
            -i ansible/inventories/lab/hosts.ini \
            ansible/playbooks/os-bootstrap.yml \
            --syntax-check

  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip

      - name: Install ansible-lint
        run: |
          pip3 install ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/playbooks/os-bootstrap.yml